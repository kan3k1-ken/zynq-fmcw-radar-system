name: Host validation

on:
  push:
  pull_request:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install -r requirements-host.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Run capture audit
        run: python vitis/radarcollect/audit_captures.py --no-cfar
